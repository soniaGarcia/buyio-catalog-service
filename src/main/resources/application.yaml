server:
  port: 8082

spring:
  application:
    name: buyio-catalog-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/db_buyio_catalog
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  secret: c3VwZXItc2VjcmV0LWtleS1mb3ItYnV5aW8tcGxhdGZvcm0tYXV0aGVudGljYXRpb24tc2VydmljZS0yMDI2
  expiration-ms: 86400000 # 24 horas

app:
  kafka:
    topic-catalog: CatalogEvents